<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دعوت‌نامه‌ی جشن روز معلم</title>
  <!-- متنی که واتساپ و تلگرام زیر لینک نشان می‌دهند (در صورت نیاز تغییر دهید) -->
  <meta property="og:title" content="دعوت‌نامه‌ی جشن روز معلم">
  <meta property="og:description" content="با کمال احترام از شما دعوت می‌کنیم.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- این بخش‌ها به‌طور خودکار از فایل config.js پر می‌شوند -->
    <p class="title" data-text="title"></p>
    <div class="line"></div>

    <p class="greeting" id="greeting"></p>
    <h1 class="name" id="name" dir="auto"></h1>

    <p class="message" data-text="message"></p>

    <ul class="details">
      <li data-row="date"><span>تاریخ</span><b data-text="date"></b></li>
      <li data-row="time"><span>ساعت</span><b data-text="time"></b></li>
      <li data-row="place"><span>مکان</span><b><span data-text="place"></span><small data-text="address"></small></b></li>
    </ul>

    <a class="btn" id="map" target="_blank" rel="noopener" hidden>مسیریابی</a>

    <p class="closing" data-text="closing"></p>
    <p class="signature" data-text="signature"></p>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
