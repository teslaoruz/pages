<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>دعوت‌نامه‌ی جشن روز معلم</title>
  <!-- متنی که واتساپ و تلگرام زیر لینک نشان می‌دهند (در صورت نیاز تغییر دهید) -->
  <meta property="og:title" content="دعوت‌نامه‌ی جشن روز معلم">
  <meta property="og:description" content="با کمال احترام از شما دعوت می‌کنیم.">
  <meta name="theme-color" content="#0f3b37">
  <link rel="preload" href="fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body class="invite">
  <!-- پس‌زمینه‌ی متحرک -->
  <div class="glow glow--1"></div>
  <div class="glow glow--2"></div>
  <div class="particles" id="particles" aria-hidden="true"></div>

  <!-- پاکت نامه (صفحه‌ی اول) -->
  <section class="intro" id="intro">
    <p class="intro__title" data-text="title"></p>
    <button class="envelope" id="envelope" type="button" aria-label="باز کردن دعوت‌نامه">
      <span class="env-back"></span>
      <span class="env-letter"><span></span><span></span><span></span></span>
      <span class="env-front"></span>
      <span class="env-flap"></span>
      <span class="env-seal">
        <svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/></svg>
      </span>
    </button>
    <p class="intro__to" id="introTo"></p>
    <button class="open-btn" id="openBtn" type="button" data-text="openButton"></button>
  </section>

  <!-- کارت دعوت (بعد از باز شدن پاکت) -->
  <main class="stage" id="stage">
    <div class="tilt" id="tilt">
      <article class="card">
        <!-- این بخش‌ها به‌طور خودکار از فایل config.js پر می‌شوند -->
        <svg class="emblem a" viewBox="0 0 64 48" aria-hidden="true">
          <path class="draw" d="M32 12C24 6 13 6 4 9v32c9-3 20-3 28 3 8-6 19-6 28-3V9c-9-3-20-3-28 3z"/>
          <path class="draw" d="M32 12v32"/>
          <path class="draw" d="M10 17c6-1.5 12-1 17 1.5M10 24c6-1.5 12-1 17 1.5M37 18.5c5-2.5 11-3 17-1.5M37 25.5c5-2.5 11-3 17-1.5"/>
        </svg>

        <p class="title a" data-text="title"></p>
        <div class="divider a"><span></span><i></i><span></span></div>

        <p class="greeting a" id="greeting"></p>
        <h1 class="name" id="name" dir="auto"></h1>

        <p class="message a" data-text="message"></p>

        <div class="details">
          <div class="tile a" data-row="date">
            <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
            <span>تاریخ</span><b data-text="date"></b>
          </div>
          <div class="tile a" data-row="time">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span>ساعت</span><b data-text="time"></b>
          </div>
          <div class="tile tile--wide a" data-row="place">
            <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
            <span>مکان</span><b data-text="place"></b><small data-text="address"></small>
          </div>
        </div>

        <a class="btn a" id="map" target="_blank" rel="noopener" hidden>مسیریابی</a>

        <p class="closing a" data-text="closing"></p>
        <p class="signature a" data-text="signature"></p>
      </article>
    </div>
  </main>

  <div class="confetti" id="confetti" aria-hidden="true"></div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
