<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ساخت لینک مهمانان</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 24px 16px; }
    .card::after { display: none; }
    .btn { border: 0; margin-left: 6px; }
    .card { max-width: 720px; margin: 0 auto; text-align: right; opacity: 1; transform: none; }
    textarea { width: 100%; min-height: 180px; margin-top: 8px; padding: 10px; font: inherit; border: 1px solid #e6dfcf; border-radius: 12px; }
    button { font: inherit; border: 0; cursor: pointer; }
    #out { margin-top: 20px; width: 100%; min-height: 200px; direction: ltr; text-align: left; font-size: .8rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1 class="title">ساخت لینک اختصاصی مهمانان</h1>
    <p class="greeting">نام هر مهمان را در یک خط بنویسید و روی «ساخت لینک‌ها» بزنید.</p>

    <textarea id="names" placeholder="محمد احمدی&#10;زهرا کریمی"></textarea>
    <button class="btn" id="make">ساخت لینک‌ها</button>
    <button class="btn" id="copy" hidden>کپی همه</button>

    <textarea id="out" readonly hidden></textarea>
  </main>

  <script>
    // آدرس سایت به‌طور خودکار تشخیص داده می‌شود
    var site = location.href.replace(/links\.html.*$/, "");

    document.getElementById("make").onclick = function () {
      var lines = document.getElementById("names").value.split("\n");
      var result = [];
      lines.forEach(function (name) {
        name = name.replace(/\s+/g, " ").trim();
        if (!name) return;
        var link = site + "?name=" + encodeURIComponent(name.replace(/ /g, "-"));
        result.push(name + "\n" + link);
      });
      var out = document.getElementById("out");
      out.value = result.join("\n\n");
      out.hidden = result.length === 0;
      document.getElementById("copy").hidden = result.length === 0;
    };

    document.getElementById("copy").onclick = function () {
      var out = document.getElementById("out");
      out.select();
      document.execCommand("copy");
      this.textContent = "کپی شد ✓";
    };
  </script>
</body>
</html>
